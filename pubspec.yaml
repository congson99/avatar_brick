name: avatar_brick
description: A Flutter avatar widget for user avatars and profile pictures, with automatic initials fallback and network, asset, file, and memory image support.
version: 1.0.2
homepage: https://github.com/congson99/avatar_brick
repository: https://github.com/congson99/avatar_brick
documentation: https://github.com/congson99/avatar_brick

environment:
  sdk: '>=2.19.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

screenshots:
  - description: 'Brick Logo - My customized package library'
    path: assets/screenshots/brick_logo.png

topics:
  - avatar
  - username
  - abbreviation

